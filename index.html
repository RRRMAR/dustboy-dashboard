<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-DUST | Live HQ</title>
    <!-- Three.js + OrbitControls (Global R128 to bypass local file CORS module blocking) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Paho MQTT JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --primary: #00ffcc;
            --warning: #ffcc00;
            --danger: #ff3333;
            --panel: rgba(10, 15, 20, 0.7);
            --border: rgba(0, 255, 204, 0.2);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Sci-Fi UI Overlays */
        .hud {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        .panel {
            background: var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Top Bar */
        #header {
            top: 20px;
            left: 20px;
        }

        #header h1 {
            margin: 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }

        #header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #88a;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f44336;
            margin-right: 5px;
            box-shadow: 0 0 8px #f44336;
        }

        .status-dot.active {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        /* Right Panel: Live Feed */
        #live-feed {
            top: 20px;
            right: 20px;
            width: 350px;
            height: 60vh;
            display: flex;
            flex-direction: column;
        }

        #live-feed h3 {
            margin: 0 0 10px 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        #feed-content {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .feed-item {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.4);
            border-left: 2px solid var(--primary);
            padding: 8px;
            animation: slideIn 0.3s ease-out;
            color: #ccc;
        }

        .feed-item.danger {
            border-left-color: var(--danger);
            color: #ffaaaa;
        }

        .feed-item.warning {
            border-left-color: var(--warning);
            color: #ffeeaa;
        }

        .feed-item.safe {
            border-left-color: var(--primary);
        }

        .feed-station {
            font-weight: bold;
            color: #fff;
            margin-bottom: 3px;
        }

        .feed-val {
            float: right;
            font-weight: bold;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Bottom Left: Leaderboard */
        #metrics {
            bottom: 20px;
            left: 20px;
            width: 300px;
        }

        #metrics h3 {
            margin: 0 0 10px 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: var(--danger);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            padding: 4px 0;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
        }

        /* Controls */
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Loading */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            color: var(--primary);
            font-size: 24px;
            letter-spacing: 5px;
            transition: opacity 1s;
        }
    </style>
</head>

<body>

    <div id="loader">INITIALIZING NEURAL GRID...</div>

    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="header" class="hud panel">
        <h1>NEURAL-DUST</h1>
        <p><span id="conn-dot" class="status-dot"></span> <span id="conn-status">SYSTEM OFFLINE</span></p>
    </div>

    <div id="live-feed" class="hud panel">
        <h3>>> LIVE SENSOR UPLINK</h3>
        <div id="feed-content"></div>
    </div>

    <div id="metrics" class="hud panel">
        <h3>CRITICAL PM2.5 ZONES (LIVE)</h3>
        <div id="leaderboard">
            <div style="font-size: 11px; color: #666; text-align: center; margin-top: 10px;">Awaiting telemetrics...
            </div>
        </div>
    </div>

    <div id="controls-hint">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>

    <script>
        // Use global THREE objects instead of module imports
        const OrbitControls = THREE.OrbitControls;

        // ============================================
        // 1. DATA STATE MANAGEMENT
        // ============================================
        const stationsMap = new Map(); // Store latest data per station
        let highestNodes = [];

        // ============================================
        // 2. THREE.JS SETUP (THE GLOBE)
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.003);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 50;
        controls.autoRotate = false;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // GLOBE
        const geo = new THREE.IcosahedronGeometry(4, 2);
        const mat = new THREE.MeshPhongMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const globe = new THREE.Mesh(geo, mat);
        scene.add(globe);

        const innerGeo = new THREE.IcosahedronGeometry(2, 1);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        const innerGlobe = new THREE.Mesh(innerGeo, innerMat);
        globe.add(innerGlobe);

        // PARTICLES
        const pCount = 2000;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i++) {
            pPos[i] = (Math.random() - 0.5) * 50;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.05, transparent: true, opacity: 0.5 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        let latestPm25 = 0;

        // ============================================
        // 3. UI DOM LOGIC
        // ============================================
        const feedContainer = document.getElementById('feed-content');
        const leaderboardContainer = document.getElementById('leaderboard');

        function updateLiveFeed(stationName, pm25, pm10, status) {
            const el = document.createElement('div');
            el.className = `feed-item ${status}`;

            let time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });

            el.innerHTML = `
                <div class="feed-station">${stationName}</div>
                <div>PM2.5: <span class="feed-val">${pm25}</span></div>
                <div>PM10:  <span class="feed-val" style="color:#aaa">${pm10}</span></div>
                <div style="color:#666; font-size:9px; margin-top:4px;">[RCV: ${time}]</div>
            `;

            feedContainer.prepend(el);
            // Cap at 15 items
            if (feedContainer.children.length > 15) {
                feedContainer.removeChild(feedContainer.lastChild);
            }
        }

        function updateLeaderboard() {
            // Sort map by pm25 descending
            const sorted = Array.from(stationsMap.values()).sort((a, b) => b.pm25 - a.pm25).slice(0, 5);

            leaderboardContainer.innerHTML = '';
            sorted.forEach((data, index) => {
                let color = '#00ffcc';
                if (data.pm25 > 50) color = '#ffcc00';
                if (data.pm25 > 100) color = '#ff3333';

                const row = document.createElement('div');
                row.className = 'metric-row';
                row.innerHTML = `
                    <span style="width: 20px; color: ${color}">0${index + 1}</span>
                    <span style="flex-grow:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:10px;">${data.name}</span>
                    <span style="font-weight:bold; font-family:'Share Tech Mono'; color: ${color}">${data.pm25}</span>
                `;
                leaderboardContainer.appendChild(row);
            });
        }

        // ============================================
        // 4. MQTT WEBSOCKETS LOGIC
        // ============================================
        const statusDot = document.getElementById('conn-dot');
        const statusText = document.getElementById('conn-status');

        const host = "dustboy-wss-bridge.laris.workers.dev";
        const port = 443;
        const topic = "DUSTBOY/+/+/+/status";
        const clientId = "NEURAL-" + Math.random().toString(16).substr(2, 8);

        const mqttClient = new Paho.MQTT.Client(host, port, "/mqtt", clientId);

        mqttClient.onConnectionLost = (resp) => {
            statusDot.classList.remove('active');
            statusText.innerText = "LINK SEVERED. RECONNECTING...";
            statusText.style.color = "#f44336";

            // Auto reconnect after 5s
            setTimeout(startMQTT, 5000);
        };

        mqttClient.onMessageArrived = (msg) => {
            try {
                // Parse payload string -> JSON
                const payload = JSON.parse(msg.payloadString);

                // Dustboy Payload shape:
                // { source_id: 111, source_name: "Name", pm25: 12.5, pm10: 20.1, ... }
                const v_pm25 = Math.round(parseFloat(payload.pm25) || 0);
                const v_pm10 = Math.round(parseFloat(payload.pm10) || 0);
                const nameTh = payload.source_name || "UNKNOWN SECTOR";
                const stationId = payload.source_id || msg.destinationName.split('/')[3];

                if (v_pm25 <= 0 && v_pm10 <= 0) return; // Skip invalid hollow data

                // Filter out massive noise anomalies
                if (v_pm25 > 1000) return;

                // 1. Save to Map
                stationsMap.set(stationId, { name: nameTh, pm25: v_pm25, pm10: v_pm10 });

                // 2. Update Global Max PM2.5 for the Globe
                let maxPm = 0;
                stationsMap.forEach(s => { if (s.pm25 > maxPm) maxPm = s.pm25; });
                latestPm25 = maxPm;

                let status = 'safe';
                if (v_pm25 > 50) status = 'warning';
                if (v_pm25 > 100) status = 'danger';

                // 3. UI Update
                updateLiveFeed(nameTh, v_pm25, v_pm10, status);
                updateLeaderboard();

            } catch (e) {
                console.error("Payload Parse Error: ", e);
            }
        };

        function startMQTT() {
            statusText.innerText = "ESTABLISHING UPLINK...";
            statusText.style.color = "#ffcc00";

            mqttClient.connect({
                timeout: 10,
                useSSL: true,
                cleanSession: true,
                onSuccess: () => {
                    statusDot.classList.add('active');
                    statusText.innerText = "UPLINK ESTABLISHED";
                    statusText.style.color = "#00ffcc";
                    mqttClient.subscribe(topic);

                    // Hide Loader
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 1000);
                },
                onFailure: (err) => {
                    statusText.innerText = "UPLINK FAILED. RETRYING...";
                    statusText.style.color = "#f44336";
                    setTimeout(startMQTT, 5000);
                }
            });
        }

        // ============================================
        // 5. ANIMATION LOOP
        // ============================================
        const colorScale = {
            safe: new THREE.Color(0x00ffcc),
            warn: new THREE.Color(0xffcc00),
            danger: new THREE.Color(0xff3333)
        };

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Rotate Globe and Particles
            globe.rotation.y += 0.005;
            globe.rotation.x += 0.002;
            particles.rotation.y -= 0.001;

            // Scale based on highest network PM2.5
            const scale = 1 + (latestPm25 / 100) * 0.5 + Math.sin(Date.now() * 0.002) * 0.05;
            const finalScale = Math.min(scale, 3.0); // Clamp to prevent massive overlaps
            globe.scale.set(finalScale, finalScale, finalScale);

            // Interpolate colors smoothly
            let targetColor = colorScale.safe;
            if (latestPm25 > 50) targetColor = colorScale.warn;
            if (latestPm25 > 100) targetColor = colorScale.danger;

            globe.material.color.lerp(targetColor, 0.05);
            innerGlobe.material.color.lerp(targetColor, 0.05);
            particles.material.color.lerp(targetColor, 0.05);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
        startMQTT();

    </script>
</body>

</html>
